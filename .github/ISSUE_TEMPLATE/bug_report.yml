name: Bug report
description: Report a reproducible CLI, MCP, or audit problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private URLs, access logs, or client crawl data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "seohead --version"
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [CLI, MCP, Python API, Docker, Screaming Frog export]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a reserved domain or synthetic fixture when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
